<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대학 신입생을 위한 GitHub 입문 가이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scroll-progress"><i></i></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">GH PRIMER · KR</span>
        <h1 class="brand-title">신입생을 위한<br>GitHub 입문 가이드</h1>
        <p class="brand-sub">왜 이렇게 하는지 같이 알아가요.</p>
        <div class="brand-progress" title="완독률">
          <span class="bar"><i id="progress-fill"></i></span>
          <span class="pct" id="progress-pct">0%</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="main" id="main-content"></main>
    <aside class="toc-rail" id="toc"></aside>
  </div>

  <div class="tweaks" id="tweaks"></div>

  <script src="app.js"></script>
</body>
</html>
